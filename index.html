<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conferência de Validades</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a1a; }
  .header { background: #2e7d32; color: white; padding: 16px; text-align: center; }
  .header h1 { font-size: 20px; }
  .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .container { max-width: 600px; margin: 0 auto; padding: 16px; }
  .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  .card h2 { font-size: 15px; color: #333; margin-bottom: 12px; }
  input[type=text], input[type=date], select {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 15px; margin-bottom: 10px; background: white;
  }
  .btn { display: block; width: 100%; padding: 13px; border: none; border-radius: 8px;
    font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; margin-bottom: 10px; }
  .btn-green { background: #2e7d32; color: white; }
  .btn-blue { background: #1565c0; color: white; }
  .btn-orange { background: #e65100; color: white; }
  .btn-gray { background: #757575; color: white; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .category-header {
    background: #e8f5e9; border-left: 4px solid #2e7d32;
    padding: 8px 12px; margin: 16px 0 8px 0;
    border-radius: 0 8px 8px 0; font-weight: 700; font-size: 14px; color: #1b5e20;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .product-card {
    background: white; border: 1px solid #e0e0e0; border-radius: 10px;
    padding: 14px; margin-bottom: 10px;
  }
  .product-card.done-ok { border-left: 4px solid #43a047; }
  .product-card.done-ret { border-left: 4px solid #e53935; }
  .product-card.done-sem { border-left: 4px solid #757575; }
  .product-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .product-dates { font-size: 12px; color: #888; margin-bottom: 10px; }
  .btns-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-sm {
    flex: 1; min-width: 80px; padding: 9px 6px; border: 2px solid #ddd;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
    background: white; color: #555; transition: all 0.15s;
  }
  .btn-sm.active-ok { background: #e8f5e9; border-color: #43a047; color: #2e7d32; }
  .btn-sm.active-ret { background: #ffebee; border-color: #e53935; color: #c62828; }
  .btn-sm.active-sem { background: #f5f5f5; border-color: #757575; color: #424242; }
  .qty-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .qty-row label { font-size: 13px; color: #555; white-space: nowrap; }
  .qty-row input { width: 70px; padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
  .progress-bar { background: #e0e0e0; border-radius: 10px; height: 8px; margin: 8px 0; overflow: hidden; }
  .progress-fill { background: #2e7d32; height: 100%; border-radius: 10px; transition: width 0.3s; }
  .progress-text { font-size: 13px; color: #666; margin-bottom: 12px; }
  .msg { padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; text-align: center; }
  .msg-info { background: #e3f2fd; color: #0d47a1; }
  .msg-ok { background: #e8f5e9; color: #1b5e20; }
  .msg-err { background: #ffebee; color: #b71c1c; }
  #manager-section { display: block; }
  #abast-section { display: none; }
  #report-section { display: none; }
  .loja-badge { background: #fff3e0; border: 1px solid #ffb300; border-radius: 20px;
    padding: 4px 12px; font-size: 13px; font-weight: 600; color: #e65100; display: inline-block; margin-bottom: 8px; }
  .summary-box { background: #f5f5f5; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 14px; padding: 3px 0; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .tag-ok { background: #e8f5e9; color: #2e7d32; }
  .tag-ret { background: #ffebee; color: #c62828; }
  .tag-sem { background: #f5f5f5; color: #616161; border: 1px solid #ccc; }
</style>
</head>
<body>

<!-- FIREBASE -->
<script type="module">

import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAOJpE4-535Ea18YOiMq5ute4dsRbH6ybc",
  authDomain: "validade-app-f43b0.firebaseapp.com",
  projectId: "validade-app-f43b0",
  storageBucket: "validade-app-f43b0.firebasestorage.app",
  messagingSenderId: "436989185322",
  appId: "1:436989185322:web:f79ed5cab622ff8ade6253"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

<div class="header">
  <h1>📦 Conferência de Validades</h1>
  <p>Capixaba Micromarket</p>
</div>

<div class="container">

<!-- SEÇÃO GESTOR -->
<div id="manager-section">
  <div class="card">
    <h2>⚙️ Gerar link para conferência</h2>
    <label style="font-size:13px;color:#555;display:block;margin-bottom:4px;">Nome da loja</label>
    <input type="text" id="loja-input" placeholder="Ex: Costa Mare" />
    <label style="font-size:13px;color:#555;display:block;margin-bottom:4px;">Data inicial</label>
    <input type="date" id="data-ini" />
    <label style="font-size:13px;color:#555;display:block;margin-bottom:4px;">Data final</label>
    <input type="date" id="data-fim" />
    <div id="manager-msg"></div>
    <button class="btn btn-green" id="btn-gerar" onclick="gerarLink()">Gerar link</button>
    <div id="link-box" style="display:none;">
      <div class="msg msg-ok" id="link-display" style="word-break:break-all;text-align:left;"></div>
      <button class="btn btn-blue" onclick="copiarLink()">📋 Copiar link</button>
      <button class="btn btn-orange" onclick="enviarWhatsApp()">📲 Enviar pelo WhatsApp</button>
    </div>
  </div>
</div>

<!-- SEÇÃO ABASTECEDOR -->
<div id="abast-section">
  <div class="card" id="store-info-card">
    <div id="loja-badge-div"></div>
    <div id="periodo-div" style="font-size:13px;color:#666;margin-bottom:8px;"></div>
    <div class="progress-text" id="progress-text">Carregando...</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div id="abast-msg"></div>
  <div id="products-list"></div>
  <div style="margin-top:16px;">
    <button class="btn btn-green" id="btn-finalizar" onclick="finalizarConferencia()" disabled>✅ Finalizar e enviar relatório</button>
  </div>
</div>

<!-- SEÇÃO RELATÓRIO -->
<div id="report-section">
  <div class="card">
    <h2>✅ Conferência finalizada!</h2>
    <div id="report-content"></div>
    <button class="btn btn-orange" id="btn-whats-report" onclick="enviarRelatorioWhats()">📲 Enviar relatório pelo WhatsApp</button>
    <button class="btn btn-gray" onclick="voltarInicio()">🔄 Nova conferência</button>
  </div>
</div>

</div><!-- /container -->

<script>
const SHEET_ID = '1s5cnwzbj0pHJibKJIfX-adqMHw0AQFh3';
const SHEET_VALIDADES = 'Controle de Validades';
const SHEET_PRODUTOS = 'Produtos';

let currentConf = null;
let produtos = []; // lista carregada do sheets
let categoriasMap = {}; // nome produto (lowercase) -> tipo de produto

// ─── Utilitários ─────────────────────────────────────────────────────────────

function fmtDate(d) {
  if (!d) return '';
  const [y, m, dia] = d.split('-');
  return `${dia}/${m}/${y}`;
}

function parseDateBR(s) {
  if (!s) return null;
  s = s.trim();
  if (s.includes('/')) {
    const [d, m, y] = s.split('/');
    return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }
  return s;
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = `<div class="msg msg-${type}">${text}</div>`;
}

function genId() {
  return Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
}

// ─── Sheets fetch ─────────────────────────────────────────────────────────────

async function fetchSheetCSV(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return await res.text();
}

function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (const line of lines) {
    if (!line.trim()) continue;
    const cols = [];
    let inQ = false, cell = '';
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { cols.push(cell.trim()); cell = ''; continue; }
      cell += c;
    }
    cols.push(cell.trim());
    rows.push(cols);
  }
  return rows;
}

// ─── Carregar categorias do Produtos ─────────────────────────────────────────

async function carregarCategorias() {
  try {
    const csv = await fetchSheetCSV(SHEET_PRODUTOS);
    const rows = parseCSV(csv);
    // Col A=Código Grade, Col B=Descrição Produto, Col C=Tipo de Produto
    // Skip header row
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      const nome = (row[1] || '').trim();
      const tipo = (row[2] || '').trim();
      if (nome) {
        categoriasMap[nome.toLowerCase()] = tipo || 'Outros';
      }
    }
  } catch (e) {
    console.warn('Não foi possível carregar categorias:', e);
    // continua sem categorias
  }
}

function getCategoria(nomeProduto) {
  const key = (nomeProduto || '').toLowerCase();
  return categoriasMap[key] || 'Outros';
}

// ─── Carregar validades do Sheets ─────────────────────────────────────────────

async function carregarProdutos(dataIni, dataFim) {
  const csv = await fetchSheetCSV(SHEET_VALIDADES);
  const rows = parseCSV(csv);
  // Col A=Código Prod, Col B=Nome, Col E=Validade, Col F..I=datas adicionais
  // rows[0] = header

  const map = {}; // nome -> {codigo, nome, datas:[]}

  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    const codigo = (row[0] || '').trim();
    const nome = (row[1] || '').trim();
    if (!nome) continue;

    const dataCols = [row[4], row[5], row[6], row[7], row[8]].map(d => parseDateBR(d)).filter(d => d);

    // Filtrar datas no intervalo
    const datasNoIntervalo = dataCols.filter(d => {
      if (!d) return false;
      if (dataIni && d < dataIni) return false;
      if (dataFim && d > dataFim) return false;
      return true;
    });

    if (datasNoIntervalo.length === 0) continue;

    const key = nome.toLowerCase();
    if (!map[key]) {
      map[key] = { codigo, nome, datas: [] };
    }
    for (const d of datasNoIntervalo) {
      if (!map[key].datas.includes(d)) map[key].datas.push(d);
    }
  }

  // Converter para array
  const lista = Object.values(map).map(p => ({
    ...p,
    datas: p.datas.sort(),
    estado: null,
    qtd: ''
  }));

  return lista;
}

// ─── GESTOR: gerar link ───────────────────────────────────────────────────────

async function gerarLink() {
  const loja = document.getElementById('loja-input').value.trim();
  const dataIni = document.getElementById('data-ini').value;
  const dataFim = document.getElementById('data-fim').value;

  if (!loja) { showMsg('manager-msg','Informe o nome da loja','err'); return; }
  if (!dataFim) { showMsg('manager-msg','Informe a data final','err'); return; }

  showMsg('manager-msg','Carregando produtos...','info');
  document.getElementById('btn-gerar').disabled = true;

  try {
    const lista = await carregarProdutos(dataIni || null, dataFim);
    if (lista.length === 0) { showMsg('manager-msg','Nenhum produto encontrado no período','err'); document.getElementById('btn-gerar').disabled=false; return; }

    const id = genId();
    const data = { loja, dataIni: dataIni||'', dataFim, produtos: lista, criado: Date.now() };

    await waitFirebase();
    const ref = window._doc(window._db, 'conferencias', id);
    await window._setDoc(ref, data);

    const url = `${location.origin}${location.pathname}?conf=${id}`;
    window._geradoLink = url;
    window._geradoLoja = loja;

    document.getElementById('link-display').textContent = url;
    document.getElementById('link-box').style.display = 'block';
    showMsg('manager-msg', `${lista.length} produto(s) carregado(s)`, 'ok');
  } catch(e) {
    showMsg('manager-msg', 'Erro: ' + e.message, 'err');
  }
  document.getElementById('btn-gerar').disabled = false;
}

function copiarLink() {
  navigator.clipboard.writeText(window._geradoLink).then(() => {
    showMsg('manager-msg','Link copiado!','ok');
  }).catch(() => {
    showMsg('manager-msg','Não foi possível copiar automaticamente. Copie o link acima manualmente.','info');
  });
}

function enviarWhatsApp() {
  const msg = encodeURIComponent(`Olá! Segue o link para conferência da loja ${window._geradoLoja}:\n${window._geradoLink}`);
  window.open(`https://wa.me/?text=${msg}`, '_blank');
}

// ─── ABASTECEDOR: carregar conferência ────────────────────────────────────────

async function waitFirebase() {
  if (window._firebaseReady) return;
  return new Promise(r => window.addEventListener('firebaseReady', r, {once:true}));
}

async function carregarConferencia(confId) {
  document.getElementById('manager-section').style.display = 'none';
  document.getElementById('abast-section').style.display = 'block';
  showMsg('abast-msg','Carregando conferência...','info');

  try {
    await waitFirebase();
    const ref = window._doc(window._db, 'conferencias', confId);
    const snap = await window._getDoc(ref);
    if (!snap.exists()) { showMsg('abast-msg','Conferência não encontrada. Verifique o link.','err'); return; }

    currentConf = { id: confId, ...snap.data() };
    produtos = currentConf.produtos;

    // Carregar categorias em paralelo
    await carregarCategorias();

    document.getElementById('loja-badge-div').innerHTML = `<div class="loja-badge">🏪 ${currentConf.loja}</div>`;
    const per = currentConf.dataIni
      ? `Período: ${fmtDate(currentConf.dataIni)} a ${fmtDate(currentConf.dataFim)}`
      : `Até: ${fmtDate(currentConf.dataFim)}`;
    document.getElementById('periodo-div').textContent = per;

    document.getElementById('abast-msg').innerHTML = '';
    renderAbast();
  } catch(e) {
    showMsg('abast-msg','Erro ao carregar: ' + e.message,'err');
  }
}

// ─── ABASTECEDOR: renderizar produtos ─────────────────────────────────────────

function renderAbast() {
  const total = produtos.length;
  const feitos = produtos.filter(p => p.estado !== null).length;
  const pct = total ? Math.round(feitos/total*100) : 0;

  document.getElementById('progress-text').textContent = `${feitos} de ${total} conferidos (${pct}%)`;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('btn-finalizar').disabled = feitos < total;

  // Agrupar por categoria (N1), ordenar alfabético dentro (N2)
  const grupos = {};
  for (const p of produtos) {
    const cat = getCategoria(p.nome);
    if (!grupos[cat]) grupos[cat] = [];
    grupos[cat].push(p);
  }

  // Ordenar categorias alfabeticamente, dentro de cada uma ordenar por nome
  const cats = Object.keys(grupos).sort((a, b) => {
    if (a === 'Outros') return 1;
    if (b === 'Outros') return -1;
    return a.localeCompare(b, 'pt-BR');
  });

  let html = '';
  for (const cat of cats) {
    const itens = grupos[cat].sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    html += `<div class="category-header">📂 ${cat}</div>`;
    for (const p of itens) {
      const idx = produtos.indexOf(p);
      const datesStr = p.datas.map(d => fmtDate(d)).join(' | ');
      let cardClass = '';
      if (p.estado === 'ok') cardClass = 'done-ok';
      else if (p.estado === 'ret') cardClass = 'done-ret';
      else if (p.estado === 'sem') cardClass = 'done-sem';

      const activeOk = p.estado === 'ok' ? 'active-ok' : '';
      const activeRet = p.estado === 'ret' ? 'active-ret' : '';
      const activeSem = p.estado === 'sem' ? 'active-sem' : '';
      const qtdRow = p.estado === 'ret' ? `
        <div class="qty-row">
          <label>Qtd retirada:</label>
          <input type="number" min="1" value="${p.qtd||''}" onchange="setQtd(${idx}, this.value)" />
        </div>` : '';

      html += `
        <div class="product-card ${cardClass}" id="card-${idx}">
          <div class="product-name">${p.nome}</div>
          <div class="product-dates">📅 ${datesStr}</div>
          <div class="btns-row">
            <button class="btn-sm ${activeOk}" onclick="setEstado(${idx},'ok')">✅ Validade ok</button>
            <button class="btn-sm ${activeRet}" onclick="setEstado(${idx},'ret')">🗑️ Retirei</button>
            <button class="btn-sm ${activeSem}" onclick="setEstado(${idx},'sem')">❌ Sem estoque</button>
          </div>
          ${qtdRow}
        </div>`;
    }
  }

  document.getElementById('products-list').innerHTML = html;
}

function setEstado(idx, estado) {
  produtos[idx].estado = estado;
  if (estado !== 'ret') produtos[idx].qtd = '';
  renderAbast();
  // Scroll para o próximo não conferido
  const proximo = produtos.findIndex((p, i) => i > idx && p.estado === null);
}

function setQtd(idx, val) {
  produtos[idx].qtd = val;
}

// ─── Finalizar conferência ─────────────────────────────────────────────────────

async function finalizarConferencia() {
  document.getElementById('btn-finalizar').disabled = true;
  showMsg('abast-msg','Salvando...','info');

  try {
    await waitFirebase();
    const ref = window._doc(window._db, 'conferencias', currentConf.id);
    await window._setDoc(ref, { ...currentConf, produtos, finalizado: Date.now() });
    showMsg('abast-msg','','info');
    mostrarRelatorio();
  } catch(e) {
    showMsg('abast-msg','Erro ao salvar: ' + e.message,'err');
    document.getElementById('btn-finalizar').disabled = false;
  }
}

function mostrarRelatorio() {
  document.getElementById('abast-section').style.display = 'none';
  document.getElementById('report-section').style.display = 'block';

  const retirados = produtos.filter(p => p.estado === 'ret');
  const ok = produtos.filter(p => p.estado === 'ok');
  const sem = produtos.filter(p => p.estado === 'sem');

  let html = `
    <div class="loja-badge">🏪 ${currentConf.loja}</div>
    <div class="summary-box">
      <div class="summary-row"><span>Total conferido</span><span>${produtos.length} itens</span></div>
      <div class="summary-row"><span>Validade ok <span class="tag tag-ok">${ok.length}</span></span></div>
      <div class="summary-row"><span>Retirados <span class="tag tag-ret">${retirados.length}</span></span></div>
      <div class="summary-row"><span>Sem estoque <span class="tag tag-sem">${sem.length}</span></span></div>
    </div>`;

  if (retirados.length > 0) {
    html += `<div style="margin-bottom:8px;font-weight:600;">🗑️ Retirados:</div>`;
    for (const p of retirados) {
      const qtdStr = p.qtd ? ` (${p.qtd} un)` : '';
      html += `<div style="font-size:14px;padding:4px 0;border-bottom:1px solid #eee;">${p.nome}${qtdStr}</div>`;
    }
  }

  document.getElementById('report-content').innerHTML = html;
}

function enviarRelatorioWhats() {
  const retirados = produtos.filter(p => p.estado === 'ret');
  const ok = produtos.filter(p => p.estado === 'ok');
  const sem = produtos.filter(p => p.estado === 'sem');

  const now = new Date();
  const dataHora = `${now.getDate().toString().padStart(2,'0')}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getFullYear()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

  const dataFimFmt = fmtDate(currentConf.dataFim);

  let msg = `*${currentConf.loja}* - Conferencia de validade\n`;
  msg += `📅 Vencidos ate ${dataFimFmt}\n\n`;

  if (retirados.length > 0) {
    msg += `✅ *Retirados (${retirados.length}):*\n`;
    for (const p of retirados) {
      const qtdStr = p.qtd ? ` - ${p.qtd} un.` : '';
      msg += `- ${p.nome}${qtdStr}\n`;
    }
    msg += '\n';
  }

  if (ok.length > 0) {
    msg += `👍 *Validade ok (${ok.length}):*\n`;
    for (const p of ok) {
      msg += `- ${p.nome}\n`;
    }
    msg += '\n';
  }

  if (sem.length > 0) {
    msg += `🚫 *Sem estoque (${sem.length}):*\n`;
    for (const p of sem) {
      msg += `- ${p.nome}\n`;
    }
  }

  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
}

function voltarInicio() {
  location.href = location.origin + location.pathname;
}

// ─── Inicialização ─────────────────────────────────────────────────────────────

// Preencher data fim com hoje
const hoje = new Date().toISOString().split('T')[0];
document.getElementById('data-fim').value = hoje;

// Verificar se é link de conferência
const params = new URLSearchParams(location.search);
const confId = params.get('conf');
if (confId) {
  carregarConferencia(confId);
}
